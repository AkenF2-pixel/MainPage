<style>

<script>

    if(e.status===401)signOut(true);
    setSt(e.status===401?"Token rejected, sign in again.":(e.status===403||e.status===404)?"Sync needs a token with Gists access. Sign out, then sign in with a token that has the gist scope.":e.message==="corrupt"?"The sync file in your Gist couldn’t be read.":"Couldn’t sync right now. Will retry.");
  }).then(function(){
    syncing=false;
    if(syncAgain){syncAgain=false;syncNow()}
  });
}
function enableSync(){
  if(!S.token){openSheet("Sync keeps your likes, saves and tags in a private Gist on your GitHub account, so it needs a token with Gists access.",function(){enableSync()});return}
  S.sync=true;persist(true);toast("Sync on");
  psc=prof.scrollTop;renderProf();syncNow(true);
}
function disableSync(){
  S.sync=false;persist(true);toast("Sync off. Your data stays here and in your Gist.");
  psc=prof.scrollTop;renderProf();
}
function iso(t){return new Date(t).toISOString().replace(/\.\d+Z$/,"Z")}
function whenAgo(t){
  var sec=(Date.now()-new Date(t))/1000;
  if(sec<90)return"just now";
  var m=sec/60;if(m<60)return Math.round(m)+"m ago";
  var h=m/60;if(h<48)return Math.round(h)+"h ago";
  var d=h/24;if(d<60)return Math.round(d)+"d ago";
  return Math.round(d/30)+"mo ago";
}
function plain(md,n){
  var t=String(md||"").replace(/\r/g,"").replace(/```[\s\S]*?```/g,"").replace(/!?\[([^\]]*)\]\([^)]*\)/g,"$1").replace(/^[#>\s*-]+/gm,"").replace(/[*_`]/g,"").replace(/\s+/g," ").trim();
  return t.length>n?t.slice(0,n).replace(/\s+\S*$/,"")+"…":t;
}
// ---- Starred tab
var STL=[],stPage=0,stDone=false,stLoading=false,stErr="";
function loadStarred(){
  if(!S.token||stLoading||stDone)return;
  stLoading=true;stErr="";stPage++;
  gh("GET","/user/starred?per_page=100&page="+stPage+"&_="+Date.now()).then(function(res){
    if(!res.ok)throw httpErr(res.status);
    return res.json();
  }).then(function(list){
    list.forEach(function(x){
      var r=norm(x);
      if(R[r.full])r=R[r.full];else R[r.full]=r;
      ST[r.full]=true;
      if(!STL.some(function(y){return y.full===r.full}))STL.push(r);
    });
    if(list.length<100)stDone=true;
    stLoading=false;redrawStarred();
  }).catch(function(e){
    stLoading=false;stPage--;
    stErr=e.status===401?"Your token was rejected.":e.status===403?"GitHub refused (rate limit or permissions).":"Couldn’t load your stars.";
    redrawStarred();
  });
}
function redrawStarred(){if(tab==="sav"&&prof.style.display==="block"&&pt==="starred"){psc=prof.scrollTop;renderProf()}}
function starredMsg(){
  if(!S.token)return'<div class="pe"><strong>Your GitHub stars</strong>Sign in to see the repos you’ve starred.<br><button id="star-login">Sign in with GitHub</button></div>';
  if(stErr)return'<div class="pe"><strong>'+esc(stErr)+'</strong><button id="st-retry">Try again</button></div>';
  if(stDone)return'<div class="pe"><strong>No starred repos yet</strong>Tap the ☆ on any repo to star it on GitHub.</div>';
  return'<div class="pe"><strong>Loading your stars…</strong></div>';
}
// ---- Stories: updates from repos you liked
var updBusy=false,updMsg="",sq=[],si=0,stm=null,sTok=0,sRem=8000,sStart=0,sOn=false,shold=null,spaused=false,sskip=false,SINCE={},DET={};
function base(n){return S.seen[n]||iso(Date.now()-7*864e5)}
function isNew(n){var u=S.upd[n];return !!(u&&u.p&&u.p>base(n))}
function storyList(){
  return S.liked.slice().reverse().filter(function(n){return S.upd[n]&&S.upd[n].p}).sort(function(a,b){
    var x=isNew(a),y=isNew(b);
    if(x!==y)return x?-1:1;
    return S.upd[b].p<S.upd[a].p?-1:1;
  }).slice(0,30);
}
function renderStories(){
  var el=document.getElementById("stories");if(!el)return;
  if(!S.liked.length){el.innerHTML='<div class="sh">Updates from repos you like will show up here.</div>';return}
  var list=storyList();
  if(!list.length){el.innerHTML='<div class="sh">'+esc(updMsg||(updBusy?"Checking your liked repos for updates…":"No updates to show yet."))+'</div>';return}
  var nw=list.filter(isNew).length;
  el.innerHTML='<div class="sh">Updates from repos you liked'+(nw?" · "+nw+" new":"")+(updMsg?" · "+esc(updMsg):"")+'</div><div class="srow">'+list.map(function(n){
    var r=get(n)||{},u=S.upd[n]||{},av=r.av||u.av;
    return'<button class="st" data-s="'+esc(n)+'"><span class="ring '+(isNew(n)?"new":"")+'"><span class="in">'+esc(n[0].toUpperCase())+(av?'<img src="'+esc(av)+'&s=120" alt="" onerror="this.remove()">':"")+'</span></span><small>'+esc(n.split("/")[1])+'</small></button>';
  }).join("")+'</div>';
}
function loadUpdates(){
  if(updBusy){renderStories();return}
  Object.keys(S.upd).forEach(function(n){if(S.liked.indexOf(n)<0){delete S.upd[n];delete S.seen[n]}});
  var now=Date.now();
  var todo=S.liked.slice(-40).reverse().filter(function(n){var u=S.upd[n];return !u||now-u.t>15*60*1000});
  if(!todo.length){renderStories();return}
  updBusy=true;updMsg="";renderStories();
  var i=0,stop=false;
  function worker(){
    if(stop||i>=todo.length)return Promise.resolve();
    var n=todo[i++];
    return gh("GET","/repos/"+n).then(function(res){
      if(res.status===403||res.status===429){stop=true;updMsg=S.token?"rate limit reached, try later":"rate limit reached, sign in to check more";return}
      if(res.status===404){S.upd[n]={p:null,t:Date.now()};return}
      if(!res.ok)return;
      return res.json().then(function(j){S.upd[n]={p:j.pushed_at,t:Date.now(),av:j.owner&&j.owner.avatar_url}});
    }).catch(function(){}).then(worker);
  }
  Promise.all([worker(),worker(),worker(),worker()]).then(function(){updBusy=false;persist(true);renderStories()});
}
function storyOpenFrom(n){var l=storyList();sq=l;si=Math.max(0,l.indexOf(n));document.getElementById("story").classList.add("open");showStory()}
function storyClose(){clearTimeout(stm);sTok++;sOn=false;document.getElementById("story").classList.remove("open");renderStories()}
function storyNav(d){si+=d;if(si<0)si=0;if(si>=sq.length){storyClose();return}showStory()}
function storyPause(){if(!sOn)return;clearTimeout(stm);sRem-=Date.now()-sStart;var v=document.getElementById("sv");if(v)v.classList.add("paused")}
function storyResume(){if(!sOn)return;var v=document.getElementById("sv");if(v)v.classList.remove("paused");sStart=Date.now();clearTimeout(stm);stm=setTimeout(function(){storyNav(1)},Math.max(300,sRem))}
function cdate(c){return c&&c.commit&&((c.commit.committer&&c.commit.committer.date)||(c.commit.author&&c.commit.author.date))}
function fetchDetails(n){
  var d=DET[n];if(d&&Date.now()-d.t<600000)return Promise.resolve(d);
  return Promise.all([
    gh("GET","/repos/"+n+"/releases/latest").then(function(res){return res.ok?res.json():null}).catch(function(){return null}),
    gh("GET","/repos/"+n+"/commits?per_page=4").then(function(res){return res.ok?res.json():[]}).catch(function(){return[]})
  ]).then(function(a){var x={t:Date.now(),rel:a[0],com:Array.isArray(a[1])?a[1]:[]};DET[n]=x;return x});
}
function slideHtml(n,r,d,since){
  var h='<h2>'+esc(n.split("/")[1])+'</h2><p class="mut">'+esc(r.desc||"")+'</p>',rl=d.rel;
  var newRel=rl&&rl.published_at&&rl.published_at>since;
  if(newRel){
    h+='<span class="pill">New release</span><h3>'+esc(rl.name||rl.tag_name)+(rl.name&&rl.name!==rl.tag_name?" · "+esc(rl.tag_name):"")+'</h3>';
    var b=plain(rl.body,240);if(b)h+='<p>'+esc(b)+'</p>';
    h+='<a class="lnk2" href="'+esc(rl.html_url)+'" target="_blank" rel="noopener">View release ↗</a>';
  }
  var nw=d.com.filter(function(c){var t=cdate(c);return t&&t>since});
  var show=(nw.length?nw:d.com).slice(0,3);
  if(show.length){
    h+='<h3>'+(nw.length?(nw.length>=4?"4+ new commits":nw.length+" new commit"+(nw.length>1?"s":"")):"Latest commits · nothing new since you last looked")+'</h3><ul>'+show.map(function(c){
      var m=String(c.commit.message||"").split("\n")[0];
      return'<li>'+esc(m.length>110?m.slice(0,108)+"…":m)+'<small>'+esc((c.commit.author&&c.commit.author.name)||"")+' · '+whenAgo(cdate(c))+'</small></li>';
    }).join("")+'</ul>';
  }
  if(rl&&!newRel)h+='<p class="mut">Latest release: '+esc(rl.tag_name)+' · '+whenAgo(rl.published_at)+'</p>';
  return h+'<a class="lnk2" href="https://github.com/'+esc(n)+'" target="_blank" rel="noopener">Open on GitHub ↗</a>';
}
function showStory(){
  clearTimeout(stm);sOn=false;spaused=false;
  var tok=++sTok,n=sq[si];
  var r=get(n)||{lang:"Other",tp:[],desc:""},u=S.upd[n]||{},o=n.split("/")[0],av=r.av||u.av;
  if(SINCE[n]===undefined)SINCE[n]=base(n);
  var since=SINCE[n];
  if(u.p){S.seen[n]=u.p;persist(true)}
  var el=document.getElementById("story");
  el.innerHTML='<div class="sv" id="sv" style="--c:'+col(r.lang)+'"><div class="sbar"><b id="sfill"></b></div><div class="shd"><span class="av">'+esc(o[0].toUpperCase())+(av?'<img src="'+esc(av)+'&s=80" alt="" onerror="this.remove()">':"")+'</span><strong>'+esc(o)+'</strong><span class="wh">'+(u.p?"· updated "+whenAgo(u.p):"")+'</span><span class="cnt">'+(si+1)+' / '+sq.length+'</span><button class="sx" id="sclose" aria-label="Close">×</button></div><div class="sbody" id="sbody"><h2>'+esc(n.split("/")[1])+'</h2><p class="mut">Loading updates…</p></div><div class="szl" data-d="-1"></div><div class="szr" data-d="1"></div></div>';
  document.getElementById("sclose").onclick=storyClose;
  function go(html){
    if(tok!==sTok)return;
    document.getElementById("sbody").innerHTML=html;
    sRem=8000;sOn=true;sStart=Date.now();
    document.getElementById("sfill").classList.add("go");
    stm=setTimeout(function(){storyNav(1)},sRem);
  }
  fetchDetails(n).then(function(d){go(slideHtml(n,r,d,since))}).catch(function(){go('<h2>'+esc(n.split("/")[1])+'</h2><p class="mut">Couldn’t load the latest activity.</p><a class="lnk2" href="https://github.com/'+esc(n)+'" target="_blank" rel="noopener">Open on GitHub ↗</a>')});
}
var stEl=document.getElementById("story");
stEl.onpointerdown=function(e){sskip=false;if(!(e.target.dataset&&e.target.dataset.d))return;clearTimeout(shold);shold=setTimeout(function(){spaused=true;storyPause()},220)};
stEl.onpointerup=stEl.onpointercancel=function(){clearTimeout(shold);if(spaused){spaused=false;sskip=true;storyResume()}};
stEl.onclick=function(e){var d=e.target.dataset&&e.target.dataset.d;if(!d)return;if(sskip){sskip=false;return}storyNav(+d)};
var STSET={},starP=null,starDone=false;
function resetStars(){STSET={};starP=null;starDone=false}
function isStarred(n){return ST[n]===false?false:!!(STSET[n]||ST[n]===true)}
function seenIt(r){return S.liked.indexOf(r.full)>-1||S.saved.indexOf(r.full)>-1||isStarred(r.full)}
function loadStarSet(){
  if(!S.token)return Promise.resolve();
  if(starP)return starP;
  var pg=0,acc=[];
  function next(){
    pg++;
    return gh("GET","/user/starred?per_page=100&page="+pg+"&_="+Date.now()).then(function(res){
      if(!res.ok)throw httpErr(res.status);
      return res.json();
    }).then(function(list){
      list.forEach(function(x){STSET[x.full_name]=1;if(acc.length<200)acc.push({n:x.full_name,l:x.language||"Other",t:(x.topics||[]).slice(0,4)})});
      if(list.length===100&&pg<10)return next();
    });
  }
  starP=next().then(function(){S.stInfo=acc;persist(true);starDone=true;pruneBlocked();rerank()}).catch(function(){starDone=true});
  return starP;
}
var SC={};
function searchQ(q){return /(^|\s)in:/.test(q)?q:q+" in:name,description,topics"}
function searchGet(url){
  var hit=SC[url];
  if(hit&&Date.now()-hit.t<600000)return Promise.resolve({ok:true,status:200,json:function(){return Promise.resolve(hit.j)}});
  return gh("GET",url.slice(22)).then(function(res){
    if(!res.ok)return res;
    return res.json().then(function(j){
      if(Object.keys(SC).length>60)SC={};
      SC[url]={t:Date.now(),j:j};
      return{ok:true,status:200,json:function(){return Promise.resolve(j)}};
    });
  });
}
function starWait(){return(tab==="for"&&S.token&&!starDone)?Promise.race([loadStarSet(),new Promise(function(r){setTimeout(r,1200)})]):Promise.resolve()}
function starInfo(r,on){
  S.stInfo=S.stInfo.filter(function(e){return e.n!==r.full});
  if(on){S.stInfo.unshift({n:r.full,l:r.lang,t:(r.tp||[]).slice(0,4)});S.stInfo=S.stInfo.slice(0,200)}
  persist(true);
}
function rerank(){
  if(tab!=="for")return;
  var P=profile(),end=document.getElementById("end"),nodes=[].slice.call(feed.querySelectorAll(".card"));
  var c=nodes.findIndex(function(x){return x.dataset.n===cur});
  nodes.slice(c+1).sort(function(a,b){return score(get(b.dataset.n),P)-score(get(a.dataset.n),P)}).forEach(function(x){feed.insertBefore(x,end)});
}
var prof=document.getElementById("prof"),pt="saved",psc=0,plist=[];
function renderProf(){
  var P=profile(),langs={};
  S.saved.concat(S.liked).forEach(function(n){var r=get(n);if(r)langs[r.lang]=1});
  var tags=S.tagsIn.concat(Object.keys(P.t).sort(function(a,b){return P.t[b]-P.t[a]})).filter(function(t,i,a){return a.indexOf(t)===i&&S.tagsOut.indexOf(t)<0}).slice(0,6);
  plist=pt==="starred"?STL.filter(function(r){return ST[r.full]!==false}):(pt==="saved"?S.saved:S.liked).slice().reverse().map(get).filter(Boolean);
  var h='<div class="pw"><div class="ph"><div class="pav"><span>'+(S.user?'<img src="'+esc(S.user.avatar)+'&s=160" alt="">':'&lt;/&gt;')+'</span></div><div class="pst"><div><b>'+S.saved.length+'</b>saved</div><div><b>'+S.liked.length+'</b>liked</div><div><b>'+Object.keys(langs).length+'</b>languages</div></div></div>';
  h+='<div class="pbio"><strong>'+(S.user?"@"+esc(S.user.login):"Your GitHub finds")+'</strong>'+(tags.length?tags.map(function(t){return"<span>#"+esc(t)+"</span>"}).join(""):"Like and save repos to build your profile.")+'</div>';
  h+='<div class="pbtn"><button id="auth">'+(S.user?"Sign out":"Sign in with GitHub")+'</button></div>';
  h+=syncRow();h+='<div id="stories"></div>';
  h+='<div class="pt"><button data-k="saved" class="'+(pt==="saved"?"on":"")+'">'+MARK+'Saved</button><button data-k="liked" class="'+(pt==="liked"?"on":"")+'">'+HEART+'Liked</button><button data-k="starred" class="'+(pt==="starred"?"on":"")+'">'+STAR+'Starred</button><button data-k="tags" class="'+(pt==="tags"?"on":"")+'"><b style="font-weight:800;margin-right:5px">#</b>Interests'+(sugList().length?'<span class="bdg">'+sugList().length+'</span>':"")+'</button></div>';
  if(pt==="tags"){h+=tagsPanel()}else if(pt==="starred"&&!plist.length){h+=starredMsg()}else if(plist.length){
    h+='<div class="grid">'+plist.map(function(r,i){

      return'<button class="tile" data-i="'+i+'" style="--c:'+col(r.lang)+'"><span class="tb">'+bd+'</span><b>'+esc(r.full.split("/")[1])+'</b><small>'+esc(r.full.split("/")[0])+' · ★ '+fmt(r.k)+'</small></button>';
    }).join("")+'</div>';
  }else{
    h+='<div class="pe"><strong>'+(pt==="saved"?"No saved repos yet":"No liked repos yet")+'</strong>'+(pt==="saved"?"Tap the bookmark on any repo and it shows up here.":"Double-tap a repo or tap the heart and it shows up here.")+'</div>';
  }
  if(pt==="starred"&&S.token&&plist.length&&!stDone)h+='<div class="pe"><button id="st-more">Load more</button></div>';
  prof.innerHTML=h+'</div>';

}
prof.onclick=function(e){
